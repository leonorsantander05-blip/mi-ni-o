<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universo de Amor ❤️</title>
  <link rel="stylesheet" href="style.css">
  <!-- Librerías de Three.js y OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="sparkle-container"></div>

  <!-- Instrucción en pantalla -->
  <div id="instruction">✨ Toca las estrellas brillantes para descubrir un mensaje ✨</div>

  <!-- Ventana emergente para los mensajes de amor -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <span id="close-btn">&times;</span>
      <div class="star-icon">🌟</div>
      <p id="modal-text">Mensaje de amor aquí...</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
